<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="KeretaKu — service records and reminders for every car in the house."
    />
    <meta name="theme-color" content="#EF6C37" />
    <!--
      Apply the saved theme (if any) before any CSS paints. Without this,
      the page always starts in whatever the OS/browser prefers and only
      switches to the saved "Light"/"Dark" choice once ProfilePage mounts
      and its useTheme() effect runs — which looked like light/dark mode
      being "inconsistent" between pages and after a refresh. This script
      must stay in sync with src/hooks/useTheme.ts's STORAGE_KEY.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('keretaku-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch {
          /* private mode or blocked storage — falls back to system preference */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <title>KeretaKu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
